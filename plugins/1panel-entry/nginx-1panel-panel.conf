# 1Panel 插件入口：面板前端整体镜像到插件自己的 ui 目录
#   /plugin/<uid>/1panel/index.html   ← 1Panel 的 index.html（改写后，即面板本身）
#   /plugin/<uid>/1panel/assets/...   ← 静态资源，本地直出
#   /plugin/<uid>/1panel/api/v2/...   ← 反代到 127.0.0.1:18080
#
# 为什么不做 iframe / 跳转：
#   应用市场客户端把插件页加载在本机 https 代理里，只放行插件入口这一个文档；
#   iframe 与 location.replace 的请求实测根本不会发出（nginx 日志为 0），
#   同源 fetch / script / css 正常。故只能让入口页本身就是面板 SPA。
#
# 注意 1：用正则 location。^~ 前缀匹配时 URI 里的 u? 会被当字面字符，匹配不到。
# 注意 2：客户端文档 URL 可能带盘符前缀（/D:/plugin/...），故统一写 (?:D:/)?。
# 注意 3：本文件按字母序先于 plugincenter.conf 加载，同路径的正则 location
#         会先命中这里（plugincenter.conf 里那条 /1panel/api/ → 9304 会被跳过）。

# 0) 客户端文档 URL 可能带盘符前缀（https://127.0.0.1:<port>/D:/plugin/...）
#    统一剥掉后再走下面正常路由，避免 404。
location ~ ^/D:(/.*)$ {
    rewrite ^/D:(/.*)$ $1 last;
}

# 1) API：走插件自己的桥（127.0.0.1:9304），由它在服务端维护 cookie 罐。
#    原因见 src/files/httpd.py 顶部注释：客户端 webview 不保存任何 cookie，
#    直连 18080 会导致登录成功也立刻 401「当前会话已过期」。
location ~ ^/(?:D:/)?plugin/u?981760641/1panel/api/ {
    rewrite ^/(?:D:/)?plugin/u?981760641/1panel/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:9304;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    # 客户端带的是 NAS 的登录令牌；桥用它给每个 NAS 用户分一份 1Panel 会话
    proxy_set_header X-Nas-Auth        $http_authorization;
    proxy_buffering   off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    client_max_body_size 2048m;
}

# 1a) 健康探测：交给桥（面板空闲时返回 up=false，页面据此提示）
location ~ ^/(?:D:/)?plugin/u?981760641/1panel/health {
    rewrite ^/(?:D:/)?plugin/u?981760641/1panel/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:9304;
    proxy_set_header Host $host;
    proxy_set_header X-Nas-Auth $http_authorization;
    add_header Cache-Control "no-store";
}

# 1b) WebSocket（终端、日志流）：桥不支持升级，仍直连面板
location ~ ^/(?:D:/)?plugin/u?981760641/1panel/ws/ {
    rewrite ^/(?:D:/)?plugin/u?981760641/1panel/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:18080;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";
    proxy_buffering   off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    client_max_body_size 2048m;
}

# 2) 静态资源：直接走本地文件，不经过 CGI（面板有 700+ 分片）
location ~ ^/(?:D:/)?plugin/u?981760641/1panel/assets/ {
    rewrite ^/(?:D:/)?plugin/u?981760641/1panel/(.*)$ /$1 break;
    root /data/minas/plugins/1panel/src/ui;
    # 文件名里带的是构建 hash，但我们改写过内容且会随面板升级整体替换，
    # 用 no-cache 让客户端每次校验 ETag，避免拿到旧分片。
    expires -1;
}

# 3) 前端路由深链（/1panel/xxx 这类无扩展名路径）返回入口页，交给 vue-router
location ~ ^/(?:D:/)?plugin/u?981760641/1panel/(?:[A-Za-z0-9_-]+/?)*$ {
    rewrite ^ /index.html break;
    root /data/minas/plugins/1panel/src/ui;
    # 入口 HTML 必须不缓存：面板升级后要立刻拿到新的分片引用
    add_header Cache-Control "no-store" always;
}
