<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1Panel</title>
<style>
  html, body { margin: 0; height: 100%; background: #12161c; overflow: hidden; }
  #frame { width: 100%; height: 100%; border: 0; display: block; }
  #veil {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    flex-direction: column; gap: 14px; color: #d7dee8;
    font: 14px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: radial-gradient(circle at 50% 35%, #1b2430, #12161c 70%);
  }
  #veil.show { display: flex; }
  #veil .dot { width: 46px; height: 46px; border-radius: 12px; background: #16b981;
    display: flex; align-items: center; justify-content: center; color: #fff;
    font-weight: 700; font-size: 20px; letter-spacing: .5px; box-shadow: 0 6px 18px rgba(22,185,129,.28); }
  #veil h1 { font-size: 16px; font-weight: 600; margin: 0; }
  #veil p { margin: 0; color: #8b98a8; max-width: 460px; text-align: center; }
  #veil .row { display: flex; gap: 10px; }
  #veil button { padding: 8px 18px; border-radius: 8px; cursor: pointer;
    border: 1px solid #2a3542; background: #1b2430; color: #d7dee8; font-size: 13px; }
  #veil button:hover { border-color: #16b981; color: #16b981; }
  /* 诊断信息：出问题时才显示，方便截图定位 */
  #diag { display: none; margin-top: 6px; font: 11px/1.5 ui-monospace, Consolas, monospace;
    color: #6b7889; max-width: 560px; text-align: left; word-break: break-all; white-space: pre-wrap;
    background: #0e1319; border: 1px solid #1e2731; border-radius: 6px; padding: 8px 10px; }
</style>
</head>
<body>
<iframe id="frame" allow="clipboard-read; clipboard-write"></iframe>
<div id="veil">
  <div class="dot">1P</div>
  <h1 id="title">正在连接 1Panel…</h1>
  <p id="hint">首次加载需要几秒</p>
  <div class="row">
    <button id="retry" type="button">重新加载</button>
    <button id="open" type="button" style="display:none">直接打开面板</button>
  </div>
  <pre id="diag"></pre>
</div>
<script>
(function () {
  var frame = document.getElementById('frame');
  var veil = document.getElementById('veil');
  var title = document.getElementById('title');
  var hint = document.getElementById('hint');
  var retry = document.getElementById('retry');
  var open = document.getElementById('open');
  var diag = document.getElementById('diag');

  // 应用市场客户端（Electron）走本机代理加载插件页，页面真实 URL 形如
  //   http://127.0.0.1:50538/D:/plugin/981760641/1panel/index.html
  // 其中 /D:/ 是客户端给 NAS 分配的盘符前缀。相对路径会被解析成
  // /D:/plugin/... 而 nginx 没有该路由（实测 404），所以这里一律用
  // 从 pathname 里抠出来的绝对前缀，绝不依赖相对路径。
  var BASE = (function () {
    var m = location.pathname.match(/\/plugin\/[^\/]+\/1panel/);
    return m ? m[0] : '/plugin/981760641/1panel';
  })();
  var PANEL = BASE + '/panel/';
  var HEALTH = BASE + '/health?t=';

  function log(s) {
    diag.textContent += s + '\n';
  }

  function show(msg, tip, detail) {
    title.textContent = msg;
    hint.textContent = tip || '';
    if (detail) { diag.style.display = 'block'; log(detail); }
    veil.classList.add('show');
  }

  function hide() { veil.classList.remove('show'); }

  function frameFilled() {
    try {
      var d = frame.contentDocument;
      return !!(d && d.body && d.body.childElementCount > 0);
    } catch (e) { return false; }
  }

  function load() {
    veil.classList.remove('show');
    diag.textContent = '';
    diag.style.display = 'none';
    open.style.display = 'none';
    log('URL   = ' + location.href);
    log('BASE  = ' + BASE);
    log('PANEL = ' + PANEL);

    var done = false;
    frame.onload = function () {
      log('iframe onload, body=' + (frameFilled() ? 'ok' : 'empty'));
      if (frameFilled()) { done = true; hide(); }
    };
    frame.src = PANEL;

    // 面板就绪探测：health 经 nginx → plugin.cgi → 1panel.cgi，探测 127.0.0.1:18080
    var tries = 0;
    (function probe() {
      tries += 1;
      fetch(HEALTH + Date.now(), { cache: 'no-store' })
        .then(function (r) { return r.json(); })
        .then(function (j) {
          log('health#' + tries + ' up=' + (j && j.up));
          if (j && j.up) { hide(); }
          else if (tries < 4) { setTimeout(probe, 1200); }
          else { show('1Panel 还没起来', '面板服务可能正在启动，稍等十几秒后点“重新加载”。'); }
        })
        .catch(function (e) {
          log('health#' + tries + ' 失败 ' + e);
          if (tries < 4) { setTimeout(probe, 1200); }
        });
    })();

    // 看门狗：iframe 一直空白（客户端可能禁用了内嵌框架）就改为在当前窗口
    // 直接打开面板子路径；同源 https，不会再触发混合内容或端口拦截。
    setTimeout(function () {
      if (done || frameFilled() || veil.classList.contains('show')) { return; }
      open.style.display = '';
      show('正在打开面板…', '内嵌加载较慢，已改为直接打开。');
      log('iframe 为空，跳转 ' + PANEL);
      location.replace(PANEL);
    }, 3500);
  }

  retry.addEventListener('click', load);
  open.addEventListener('click', function () { location.replace(PANEL); });
  load();
})();
</script>
</body>
</html>
